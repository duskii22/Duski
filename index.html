<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Hub X - Full Kaitun Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h1, h2 { color: #38bdf8; text-align: center; }
        .card { background: #1e293b; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        .status-box { background: #0f172a; padding: 10px; border-radius: 6px; border-left: 4px solid #38bdf8; }
        label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; background: #334155; padding: 8px 12px; border-radius: 4px; }
        input[type="checkbox"] { transform: scale(1.3); cursor: pointer; }
        .inventory-list { max-height: 120px; overflow-y: auto; background: #0f172a; padding: 8px; border-radius: 4px; font-size: 13px; color: #cbd5e1; }
    </style>
</head>
<body>
<div class="container">
    <h1>Speed Hub X Master Control</h1>
    
    <!-- Live Stats & Inventory Inspector -->
    <div class="card">
        <h2>Live Player Stats</h2>
        <div class="status-grid">
            <div class="status-box"><strong>Level:</strong> <span id="lbl-level">Loading...</span></div>
            <div class="status-box"><strong>Race:</strong> <span id="lbl-race">Loading...</span></div>
        </div>
        <div style="margin-top: 10px;">
            <strong>Stored Swords:</strong>
            <div id="inv-swords" class="inventory-list">Loading swords...</div>
        </div>
        <div style="margin-top: 10px;">
            <strong>Stored Fruits:</strong>
            <div id="inv-fruits" class="inventory-list">Loading fruits...</div>
        </div>
    </div>

    <!-- MAIN MENU CONTROLS (Mirrors your script tabs) -->
    <div class="card">
        <h2>Main / Farming Toggles</h2>
        <label>Auto Farm Level <input type="checkbox" id="Auto Farm Level" onclick="updateToggle('AutoFarmLevel')"></label>
        <label>Auto Farm Nearest <input type="checkbox" id="Auto Farm Neareast" onclick="updateToggle('Auto Farm Neareast')"></label>
        <label>Auto Farm Mastery <input type="checkbox" id="Auto Farm Mastery" onclick="updateToggle('Auto Farm Mastery')"></label>
        <label>Bring Mob <input type="checkbox" id="Bring Mob" onclick="updateToggle('Bring Mob')"></label>
        <label>Fast Attack <input type="checkbox" id="Fast Attack" onclick="updateToggle('Fast Attack')"></label>
    </div>

    <div class="card">
        <h2>Item & Quests</h2>
        <label>Auto Second World <input type="checkbox" id="Auto Second World" onclick="updateToggle('Auto Second World')"></label>
        <label>Auto Third World <input type="checkbox" id="Auto Third World" onclick="updateToggle('Auto Third World')"></label>
        <label>Auto Farm Bones <input type="checkbox" id="Auto Farm Bones" onclick="updateToggle('Auto Farm Bones')"></label>
        <label>Auto Elite Hunter <input type="checkbox" id="Auto Elite Hunter" onclick="updateToggle('Auto Elite Hunter')"></label>
    </div>

    <div class="card">
        <h2>Sea Events & Bosses</h2>
        <label>Auto Collect Azure Ember <input type="checkbox" id="Auto Collect Azure Ember" onclick="updateToggle('Auto Collect Azure Ember')"></label>
        <label>Auto Drive Boat To Sea <input type="checkbox" id="Auto Drive Boat To Sea" onclick="updateToggle('Auto Drive Boat To Sea')"></label>
        <label>Auto Find Leviathan <input type="checkbox" id="Auto Find Leviathan" onclick="updateToggle('Auto Find Leviathan')"></label>
        <label>Auto Attack Boss <input type="checkbox" id="Auto Attack Boss" onclick="updateToggle('Auto Attack Boss')"></label>
    </div>

    <div class="card">
        <h2>Shop & Fruit</h2>
        <label>Auto Store Fruit <input type="checkbox" id="Auto Store Fruit" onclick="updateToggle('Auto Store Fruit')"></label>
        <label>Auto Random Fruit <input type="checkbox" id="Auto Random Fruit" onclick="updateToggle('Auto Random Fruit')"></label>
        <label>Auto Buy Legendary Sword <input type="checkbox" id="Auto Buy Legendary Sword" onclick="updateToggle('Auto Buy Legendary Sword')"></label>
    </div>
</div>

<script>
    const API_URL = "https://duskikaitun-default-rtdb.firebaseio.com/KaitunData.json";

    async function syncDashboard() {
        try {
            let res = await fetch(API_URL);
            let data = await res.json();
            if (!data) return;

            // Update stats
            document.getElementById('lbl-level').innerText = data.Level || 1;
            document.getElementById('lbl-race').innerText = data.Race || "Human";

            // Update Inventory display
            if (data.Inventory) {
                document.getElementById('inv-swords').innerText = data.Inventory.Swords.join(', ') || "None stored";
                document.getElementById('inv-fruits').innerText = data.Inventory.Fruits.join(', ') || "None stored";
            }

            // Update Toggle states from game
            if (data.Settings) {
                for (const [key, value] of Object.entries(data.Settings)) {
                    let el = document.getElementById(key);
                    if (el && document.activeElement !== el) {
                        el.checked = Boolean(value);
                    }
                }
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function updateToggle(id) {
        let isChecked = document.getElementById(id).checked;
        try {
            let res = await fetch(API_URL);
            let data = await res.json() || {};
            if (!data.Settings) data.Settings = {};
            data.Settings[id] = isChecked;

            await fetch(API_URL, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
        } catch (e) {
            console.error(e);
        }
    }

    setInterval(syncDashboard, 3000);
    syncDashboard();
</script>
</body>
</html>
