<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kaitun Remote Control Panel</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: Arial, sans-serif; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; margin-top: 0; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; background: #0f172a; padding: 10px; border-radius: 8px; }
        ul { padding-left: 20px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Kaitun Mobile Dashboard</h1>

    <!-- LIVE STATS SECTION -->
    <div class="card">
        <h2 id="username">Duski Kaitun Active</h2>
        <p><strong>Level:</strong> <span id="level">--</span></p>
        <p><strong>Race:</strong> <span id="race">--</span></p>
        <p><strong>Status:</strong> <span id="status">Connecting...</span></p>
    </div>

    <!-- CONTROL PANEL SECTION (Toggles) -->
    <div class="card">
        <h2>Remote Controls</h2>
        <div class="toggle-row">
            <span>Auto Farm Level</span>
            <input type="checkbox" id="AutoFarmLevel" onclick="toggleSetting('AutoFarmLevel')">
        </div>
        <div class="toggle-row">
            <span>Auto Store Fruit</span>
            <input type="checkbox" id="AutoStoreFruit" onclick="toggleSetting('AutoStoreFruit')">
        </div>
        <div class="toggle-row">
            <span>Auto Haki</span>
            <input type="checkbox" id="AutoHaki" onclick="toggleSetting('AutoHaki')">
        </div>
    </div>

    <!-- INVENTORY SECTION -->
    <div class="card">
        <h2>Inventory (Fruits & Swords)</h2>
        <ul id="inventory-list"><li>Inventory tracking loading...</li></ul>
    </div>

    <script>
        const API_URL = "https://duskikaitun-default-rtdb.firebaseio.com/.json";

        async function syncDashboard() {
            try {
                let res = await fetch(API_URL);
                let data = await res.json();

                if (!data) {
                    document.getElementById('status').innerText = "Waiting for game telemetry...";
                    return;
                }

                // Update text stats
                document.getElementById('level').innerText = data.Level || 1;
                document.getElementById('race').innerText = data.Race || "Human";
                document.getElementById('status').innerText = data.Status || "Running";

                // Update checkboxes based on cloud settings
                if (data.Settings) {
                    if(document.activeElement !== document.getElementById('AutoFarmLevel')) {
                        document.getElementById('AutoFarmLevel').checked = data.Settings.AutoFarmLevel;
                    }
                    if(document.activeElement !== document.getElementById('AutoStoreFruit')) {
                        document.getElementById('AutoStoreFruit').checked = data.Settings.AutoStoreFruit;
                    }
                    if(document.activeElement !== document.getElementById('AutoHaki')) {
                        document.getElementById('AutoHaki').checked = data.Settings.AutoHaki;
                    }
                }
            } catch (e) {
                console.error("Dashboard sync error:", e);
                document.getElementById('status').innerText = "Connection Error";
            }
        }

        async function toggleSetting(settingName) {
            let isChecked = document.getElementById(settingName).checked;
            try {
                let getRes = await fetch(API_URL);
                let currentData = await getRes.json() || {};
                
                if (!currentData.Settings) currentData.Settings = {};
                currentData.Settings[settingName] = isChecked;

                await fetch(API_URL, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(currentData)
                });
            } catch (e) {
                console.error("Toggle update error:", e);
            }
        }

        setInterval(syncDashboard, 3000);
        syncDashboard();
    </script>
</body>
</html>
